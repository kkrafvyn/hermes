[platformio]
src_dir = ../src
core_dir = F:/hermes/.platformio
packages_dir = F:/hermes/.platformio/packages
platforms_dir = F:/hermes/.platformio/platforms
build_cache_dir = F:/hermes/.platformio/buildcache

[env:stm32h7]
platform = ststm32
framework = arduino
board = nucleo_h743zi
monitor_speed = 115200
build_flags = -DHERMES_NODE_ID=0 -DHERMES_STM32

[env:stm32h7_raw]
extends = env:stm32h7
build_flags = -DHERMES_NODE_ID=0 -DHERMES_STM32 -DHERMES_BOARD_RAW=1
