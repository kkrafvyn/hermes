[platformio]
src_dir = ../src
core_dir = F:/hermes/.platformio
packages_dir = F:/hermes/.platformio/packages
platforms_dir = F:/hermes/.platformio/platforms
build_cache_dir = F:/hermes/.platformio/buildcache

[env:esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32 -DHERMES_HTTP_SERVER=1

; Blank ESP32-S3 — user assigns GPIO over http://<ip>/board
[env:esp32s3_raw]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DHERMES_BOARD_RAW=1

; Waveshare ESP32-S3-SIM7670G-4G (16MB flash, 8MB PSRAM)
[env:esp32s3_sim7670g]
extends = env:esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_flags =
  ${env:esp32s3.build_flags}
  -DHERMES_BOARD_WAVESHARE_SIM7670G=1
