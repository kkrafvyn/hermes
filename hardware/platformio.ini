; HERMES node firmware — build all ESP / STM32 / nRF targets
; Toolchains cached on F: drive (see scripts/pio_env.ps1)

[platformio]
default_envs = esp8266
core_dir = F:/hermes/.platformio
packages_dir = F:/hermes/.platformio/packages
platforms_dir = F:/hermes/.platformio/platforms
build_cache_dir = F:/hermes/.platformio/buildcache
extra_configs =
    platformio_mcu.ini

[env]
monitor_speed = 115200

; --- Espressif (core) ---
[env:esp8266]
platform = espressif8266
framework = arduino
board = esp12e
upload_speed = 921600
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP8266

[env:esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32

[env:esp32c3]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32

; --- STMicro (core) ---
[env:stm32h7]
platform = ststm32
framework = arduino
board = nucleo_h743zi
build_flags = -DHERMES_STM32 -DHERMES_NODE_ID=0

[env:stm32f4]
platform = ststm32
framework = arduino
board = nucleo_f446re
build_flags = -DHERMES_STM32 -DHERMES_NODE_ID=0

; --- Nordic (core) ---
[env:nrf52840]
platform = nordicnrf52
framework = arduino
board = adafruit_feather_nrf52840
build_flags = -DHERMES_NRF -DHERMES_NODE_ID=2
