[platformio]
src_dir = ../src
core_dir = F:/hermes/.platformio
packages_dir = F:/hermes/.platformio/packages
platforms_dir = F:/hermes/.platformio/platforms
build_cache_dir = F:/hermes/.platformio/buildcache

[env:nrf52840]
platform = nordicnrf52
framework = arduino
board = adafruit_feather_nrf52840
monitor_speed = 115200
build_flags = -DHERMES_NODE_ID=2 -DHERMES_NRF

[env:nrf52840_raw]
extends = env:nrf52840
build_flags = -DHERMES_NODE_ID=2 -DHERMES_NRF -DHERMES_BOARD_RAW=1
lib_deps = adafruit/Adafruit TinyUSB Library
