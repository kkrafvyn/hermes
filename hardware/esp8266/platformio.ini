; HERMES ESP8266 — uses shared node firmware (F: drive cache)
[platformio]
src_dir = ../src
core_dir = F:/hermes/.platformio
packages_dir = F:/hermes/.platformio/packages
platforms_dir = F:/hermes/.platformio/platforms
build_cache_dir = F:/hermes/.platformio/buildcache

[env:esp8266]
platform = espressif8266
framework = arduino
board = esp12e
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DHERMES_ESP8266
  -DHERMES_NODE_ID=0
  -DHERMES_HTTP_SERVER=1
  -DHERMES_GPIO=1
  -DHERMES_MQTT=1
  -DHERMES_OTA=1
lib_deps =
  knolleary/PubSubClient@^2.8
board_build.ldscript = eagle.flash.4m3m.ld

[env:esp8266_raw]
extends = env:esp8266
build_flags =
  ${env:esp8266.build_flags}
  -DHERMES_BOARD_RAW=1
