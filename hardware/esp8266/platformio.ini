; HERMES ESP8266 — uses shared node firmware (F: drive cache)
[platformio]
src_dir = ../src
core_dir = F:/hermes/.platformio
packages_dir = F:/hermes/.platformio/packages
platforms_dir = F:/hermes/.platformio/platforms
build_cache_dir = F:/hermes/.platformio/buildcache

[env:esp8266]
platform = espressif8266
framework = arduino
board = esp12e
monitor_speed = 115200
upload_speed = 921600
build_flags = -DHERMES_ESP8266 -DHERMES_NODE_ID=1
lib_deps =
