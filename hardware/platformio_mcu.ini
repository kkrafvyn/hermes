; HERMES extended MCU environments — included from platformio.ini

; --- ESP8266 modules & dev boards ---
[env:esp8285]
platform = espressif8266
framework = arduino
board = esp8285
build_flags = -DHERMES_ESP8266 -DHERMES_NODE_ID=1

[env:esp01]
platform = espressif8266
framework = arduino
board = esp01_1m
build_flags = -DHERMES_ESP8266 -DHERMES_NODE_ID=1

[env:esp07]
platform = espressif8266
framework = arduino
board = esp12e
build_flags = -DHERMES_ESP8266 -DHERMES_NODE_ID=1

[env:d1_mini]
platform = espressif8266
framework = arduino
board = d1_mini
build_flags = -DHERMES_ESP8266 -DHERMES_NODE_ID=1

[env:nodemcu]
platform = espressif8266
framework = arduino
board = nodemcuv2
build_flags = -DHERMES_ESP8266 -DHERMES_NODE_ID=1

; --- ESP32 family ---
[env:esp32s2]
platform = espressif32
framework = arduino
board = esp32-s2-saola-1
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32

[env:esp32c6]
platform = espressif32
framework = arduino
board = esp32-c6-devkitc-1
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32

[env:esp32p4]
platform = espressif32
framework = arduino
board = esp32-p4-function-ev-board
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32

[env:esp32_wrover]
platform = espressif32
framework = arduino
board = esp-wrover-kit
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32 -DBOARD_HAS_PSRAM

[env:esp32s3_psram]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32 -DBOARD_HAS_PSRAM

[env:esp32_cam]
platform = espressif32
framework = arduino
board = esp32cam
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32 -DHERMES_CAMERA

[env:esp32_eth]
platform = espressif32
framework = arduino
board = wt32-eth01
build_flags = -DHERMES_NODE_ID=1 -DHERMES_ESP32 -DHERMES_ETHERNET

